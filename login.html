<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Vivero Raíz</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header>
    <h1>Vivero Raíz</h1>
    <button id="btn-menu" class="btn-menu" aria-label="Abrir menú">&#9776;</button>
    <nav id="nav-principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Ingresar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Acceso a Intranet</h2>
      <p>Ingresá con tus credenciales de administrador del vivero.</p>

      <form id="form-login" novalidate>
        <div>
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="admin@viveroraiz.com" required>
        </div>

        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btn-ingresar">Ingresar al panel</button>
      </form>
    </section>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; VIVERO RAÍZ — TRABAJO PRÁCTICO INTEGRADOR - Nicolás Sánchez</p>
    </div>
  </footer>

  <script src="js/validaciones.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (Auth.obtenerUsuario()) {
        window.location.href = "listado.html";
        return;
      }

      const params = new URLSearchParams(window.location.search);
      if (params.get("redirigido") === "1") {
        Swal.fire({
          icon: "warning",
          title: "Acceso restringido",
          text: "Tenés que iniciar sesión para acceder a la intranet.",
          confirmButtonColor: "#1b3b22"
        });
      }

      const formLogin = document.getElementById("form-login");
      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
          Swal.fire({
            icon: "error",
            title: "Campos incompletos",
            text: "Por favor completá tu correo y contraseña.",
            confirmButtonColor: "#1b3b22"
          });
          return;
        }

        try {
          const usuario = await Auth.login(email, password);
          await Swal.fire({
            icon: "success",
            title: `¡Bienvenido, ${usuario.nombre}!`,
            text: "Iniciando panel de gestión...",
            timer: 1300,
            showConfirmButton: false
          });
          window.location.href = "listado.html";
        } catch (err) {
          Swal.fire({
            icon: "error",
            title: "Error de acceso",
            text: err.message,
            confirmButtonColor: "#c01d1d"
          });
        }
      });
    });
  </script>
</body>
</html>
